name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  # Los commits hechos con GITHUB_TOKEN no disparan otros flujos, así que
  # las lecturas del recolector no republicarían el sitio por sí solas.
  workflow_run:
    workflows: ["Recolector horario"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    # Si el recolector falló, no tiene sentido republicar
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: despliegue
        uses: actions/deploy-pages@v4
