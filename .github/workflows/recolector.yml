name: Recolector diario

# 12:00 UTC = 07:00 en Bogotá (UTC-5, sin horario de verano).
# GitHub puede demorar el cron unos minutos en horas de alta carga.
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:        # botón «Run workflow» para forzar una corrida

permissions:
  contents: write

concurrency:
  group: recoleccion
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Leer las fuentes originales
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: node collector/collect.js

      - name: Podar el archivo a 400 días
        run: |
          find data/history -name '*.json' -type f -mtime +400 -delete || true

      - name: Publicar los datos
        run: |
          git config user.name  'recolector'
          git config user.email 'recolector@users.noreply.github.com'
          git add data/
          if git diff --staged --quiet; then
            echo 'Sin cambios en los datos.'
          else
            git commit -m "datos: corte del $(TZ=America/Bogota date '+%Y-%m-%d %H:%M')"
            git push
          fi
