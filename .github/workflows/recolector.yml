name: Recolector horario

# Dos citas por hora, a los minutos :17 y :47 (UTC; Bogotá es UTC-5 fijo,
# así que son los mismos minutos allá).
#
# Por qué no en punto: el minuto :00 es el más congestionado de GitHub y sus
# cron se retrasan o se saltan ahí. Y por qué dos: si una cita se pierde, la
# siguiente recoge media hora después. Una corrida sin novedades no escribe
# nada, así que la segunda cita no cuesta más que unos segundos de máquina.
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:        # botón «Run workflow» para forzar una corrida

permissions:
  contents: write

concurrency:
  group: recoleccion
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Leer las fuentes originales
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: node collector/collect.js

      - name: Podar el archivo a 400 días
        run: |
          find data/history -name '*.json' -type f -mtime +400 -delete || true

      - name: Publicar los datos
        run: |
          git config user.name  'recolector'
          git config user.email 'recolector@users.noreply.github.com'
          git add data/
          if git diff --staged --quiet; then
            echo 'Sin cambios en los datos.'
          else
            git commit -m "datos: lectura del $(TZ=America/Bogota date '+%Y-%m-%d %H:%M')"
            # El push puede chocar con otra corrida: reintentar sobre la punta
            for intento in 1 2 3; do
              git push && exit 0
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
              sleep $((intento * 5))
            done
            git push
          fi
